DATA.forEach(prod => {
  const div = document.createElement("div");
  div.className = "prod";
  div.innerHTML = `<h2>${prod.nombre} <small>${prod.id}</small></h2><div class="variantes"></div>`;
  const vwrap = div.querySelector(".variantes");
  prod.colores.forEach(c => {
    total++;
    const row = document.createElement("div");
    row.className = "variante";
    row.innerHTML = `
      <img src="${c.img}" loading="lazy" onerror="this.style.opacity=0.15">
      <div class="campos">
        <input type="text" placeholder="Nombre del color" value="" data-id="${prod.id}" data-idx="${c.idx}" data-field="nombre">
        <input type="color" value="${c.hexActual}" data-id="${prod.id}" data-idx="${c.idx}" data-field="hex">
        <span class="hexlbl">${c.hexActual}</span>
      </div>`;
    const colorInput = row.querySelector('input[type=color]');
    const hexLbl = row.querySelector('.hexlbl');
    colorInput.addEventListener('input', () => { hexLbl.textContent = colorInput.value; row.classList.add('ok'); });
    row.querySelector('input[type=text]').addEventListener('input', () => row.classList.add('ok'));
    vwrap.appendChild(row);
  });
  cont.appendChild(div);
});

document.getElementById("contador").textContent = `${total} colores para completar en total`;

document.getElementById("descargar").onclick = () => {
  const resultado = {};
  document.querySelectorAll('.variante').forEach(row => {
    const nombreInput = row.querySelector('[data-field=nombre]');
    const hexInput = row.querySelector('[data-field=hex]');
    const id = nombreInput.dataset.id, idx = nombreInput.dataset.idx;
    if(!resultado[id]) resultado[id] = {};
    resultado[id][idx] = { nombre: nombreInput.value.trim(), hex: hexInput.value };
  });
  const blob = new Blob([JSON.stringify(resultado, null, 2)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "colores.json";
  a.click();
};
</script>
</body>
</html>
