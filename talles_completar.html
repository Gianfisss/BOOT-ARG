<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Editar talles por color</title>
<style>
  *{box-sizing:border-box;}
  body{font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#0f1115;color:#f2f2f2;margin:0;padding:18px;}
  .wrap{max-width:820px;margin:0 auto;}
  h1{font-size:20px;margin:0 0 6px;}
  p.hint{color:#9aa0a8;font-size:14px;margin:0 0 20px;line-height:1.5;}
  .top{position:sticky;top:0;background:#0f1115;padding:10px 0 16px;z-index:5;}
  .prod{background:#1a1d24;border:1px solid #2a2e37;border-radius:14px;padding:16px;margin-bottom:16px;}
  .prod h2{font-size:15px;margin:0 0 12px;color:#fff;}
  .prod h2 small{color:#9aa0a8;font-weight:400;margin-left:6px;}
  .fila{display:flex;gap:12px;align-items:flex-start;padding:10px;background:#12151a;border-radius:10px;margin-bottom:10px;}
  .fila:last-child{margin-bottom:0;}
  .fila img{width:52px;height:52px;object-fit:cover;border-radius:8px;background:#222;flex-shrink:0;}
  .sw{width:18px;height:18px;border-radius:50%;display:inline-block;border:1px solid rgba(255,255,255,.35);margin-right:6px;vertical-align:-3px;}
  .info{flex:1;min-width:0;}
  .info .nombre{font-size:14px;font-weight:700;margin-bottom:8px;}
  .talles{display:flex;flex-wrap:wrap;gap:6px;}
  .talle{padding:7px 0;width:42px;text-align:center;border-radius:8px;border:1px solid #2a2e37;background:#1a1d24;color:#9aa0a8;font-size:13px;font-weight:700;cursor:pointer;user-select:none;}
  .talle.on{background:#123c2a;border-color:#2fbf6a;color:#5be08a;}
  .acciones{display:flex;gap:6px;margin-top:6px;}
  .acciones button{font-size:11.5px;padding:5px 9px;border-radius:6px;background:transparent;border:1px solid #2a2e37;color:#9aa0a8;cursor:pointer;}
  button.dl{width:100%;padding:15px;border:none;border-radius:10px;background:#009ee3;color:#fff;font-weight:800;font-size:15px;cursor:pointer;margin-top:6px;}
  .contador{font-size:12.5px;color:#9aa0a8;margin-top:8px;text-align:center;}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>Talles disponibles por color</h1>
    <p class="hint">Tocá cada talle para marcarlo <b>disponible</b> (verde) o <b>agotado</b> (gris). Ya viene precargado con lo que tenés cargado hoy. Cuando termines, tocá "Descargar cambios" y mandame ese archivo.</p>
  </div>
  <div id="lista"></div>
  <button class="dl" id="descargar">⬇️ Descargar cambios (talles.json)</button>
  <p class="contador" id="contador"></p>
</div>

<script>
const DATA = __DATA__;
const cont = document.getElementById("lista");
let totalColores = 0;

DATA.forEach(prod => {
  const div = document.createElement("div");
  div.className = "prod";
  div.innerHTML = `<h2>${prod.nombre} <small>${prod.id}</small></h2>`;
  prod.colores.forEach(c => {
    totalColores++;
    const fila = document.createElement("div");
    fila.className = "fila";
    fila.dataset.id = prod.id;
    fila.dataset.idx = c.idx;
    const chips = prod.talles.map(t => {
      const on = c.disponibles.includes(t);
      return `<div class="talle ${on?'on':''}" data-t="${t}">${t}</div>`;
    }).join("");
    fila.innerHTML = `
      <img src="${c.img}" loading="lazy" onerror="this.style.opacity=0.15">
      <div class="info">
        <div class="nombre"><span class="sw" style="background:${c.hex}"></span>${c.nombre}</div>
        <div class="talles">${chips}</div>
        <div class="acciones">
          <button data-accion="todos">Todos disponibles</button>
          <button data-accion="ninguno">Ninguno disponible</button>
        </div>
      </div>`;
    fila.querySelectorAll(".talle").forEach(el => {
      el.addEventListener("click", () => el.classList.toggle("on"));
    });
    fila.querySelector('[data-accion="todos"]').onclick = () => fila.querySelectorAll(".talle").forEach(el => el.classList.add("on"));
    fila.querySelector('[data-accion="ninguno"]').onclick = () => fila.querySelectorAll(".talle").forEach(el => el.classList.remove("on"));
    div.appendChild(fila);
  });
  cont.appendChild(div);
});

document.getElementById("contador").textContent = `${DATA.length} productos, ${totalColores} colores en total`;

document.getElementById("descargar").onclick = () => {
  const resultado = {};
  document.querySelectorAll(".fila").forEach(fila => {
    const id = fila.dataset.id, idx = fila.dataset.idx;
    const disponibles = [...fila.querySelectorAll(".talle.on")].map(el => parseInt(el.dataset.t, 10));
    if (!resultado[id]) resultado[id] = {};
    resultado[id][idx] = disponibles;
  });
  const blob = new Blob([JSON.stringify(resultado, null, 2)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "talles.json";
  a.click();
};
</script>
</body>
</html>
