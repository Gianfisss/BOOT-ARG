<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1">
<title>Botines Importados · Stock real</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ============================================================
   PALETA Y VARIABLES — cambiá los colores acá
   ============================================================ */
:root{
  --bg:#08090a;
  --bg-2:#101214;
  --surface:#15181b;
  --line:#24282d;
  --txt:#f3f4f5;
  --muted:#8d949c;
  --volt:#ccff00;        /* acento principal */
  --hot:#ff1d58;         /* acento promo / fuego */
  --ok:#25d366;          /* whatsapp */
  --radius:14px;
  --max:1180px;
  font-synthesis-weight:none;
}
:root:not([data-theme="light"]){color-scheme:dark;}
*{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%;}
body{
  background:var(--bg);color:var(--txt);
  font-family:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:16px;line-height:1.55;overflow-x:hidden;
  -webkit-tap-highlight-color:transparent;
}
body.lock{position:fixed;left:0;right:0;overflow:hidden;width:100%;}
img{max-width:100%;display:block;}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit;}
button{cursor:pointer;border:none;background:none;touch-action:manipulation;}
a{color:inherit;text-decoration:none;touch-action:manipulation;}
:focus-visible{outline:2px solid var(--volt);outline-offset:2px;}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important;}}

.wrap{max-width:var(--max);margin:0 auto;padding:0 16px;}
.display{font-family:"Archivo Black",Impact,sans-serif;letter-spacing:-.02em;line-height:.95;text-transform:uppercase;}

/* ---------- BARRA SUPERIOR ---------- */
.ticker{background:var(--volt);color:#000;font-weight:700;font-size:12.5px;text-align:center;padding:7px 12px;letter-spacing:.01em;}
.ticker b{font-weight:800;}

/* ---------- HEADER ---------- */
header{position:sticky;top:0;z-index:60;background:rgba(8,9,10,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);}
.hdr{display:flex;align-items:center;justify-content:space-between;gap:12px;height:62px;}
.logo{font-family:"Archivo Black";font-size:20px;letter-spacing:-.03em;text-transform:uppercase;}
.logo span{color:var(--volt);}
.hdr-right{display:flex;align-items:center;gap:8px;}
.btn-wsp{display:inline-flex;align-items:center;gap:6px;background:var(--ok);color:#04220f;font-weight:700;font-size:13px;padding:9px 13px;border-radius:99px;min-height:38px;}
.btn-cart{display:inline-flex;align-items:center;gap:7px;background:var(--surface);border:1px solid var(--line);padding:9px 13px;border-radius:99px;font-weight:700;font-size:13px;min-height:38px;}
.btn-cart .count{background:var(--volt);color:#000;min-width:20px;height:20px;border-radius:99px;display:grid;place-items:center;font-size:12px;font-weight:800;}
.promo-strip{background:linear-gradient(90deg,var(--hot),#8c0d33);font-size:12px;font-weight:700;text-align:center;padding:6px 12px;overflow:hidden;white-space:nowrap;}

/* ---------- HERO ---------- */
.hero{position:relative;padding:44px 0 36px;overflow:hidden;}
.hero::before{content:"";position:absolute;inset:0;background:
   radial-gradient(60% 55% at 78% 18%,rgba(204,255,0,.16),transparent 70%),
   radial-gradient(50% 50% at 10% 90%,rgba(255,29,88,.14),transparent 70%);pointer-events:none;}
.hero-grid{position:relative;display:grid;grid-template-columns:1.05fr .95fr;gap:34px;align-items:center;}
.eyebrow{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:800;color:var(--volt);border:1px solid rgba(204,255,0,.35);background:rgba(204,255,0,.07);padding:5px 11px;border-radius:99px;margin-bottom:14px;}
.hero h1{font-size:clamp(40px,7.4vw,76px);margin-bottom:12px;}
.hero h1 em{font-style:normal;color:var(--volt);}
.hero p.lead{color:var(--muted);font-size:16.5px;max-width:46ch;margin-bottom:18px;}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px;}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:7px 12px;font-size:12.5px;font-weight:600;}
.promo-box{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:18px;}
.promo-box h3{font-size:13px;font-weight:800;color:var(--hot);margin-bottom:11px;letter-spacing:.02em;}
.promo-rows{display:grid;gap:8px;margin-bottom:10px;}
.promo-row{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--bg-2);border-radius:10px;padding:9px 12px;font-size:13.5px;}
.promo-row b{background:var(--volt);color:#000;padding:2px 9px;border-radius:99px;font-size:12.5px;font-weight:800;}
.promo-box small{color:var(--muted);font-size:12px;display:block;}
.cta{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--volt);color:#000;font-weight:800;font-size:15px;padding:14px 26px;border-radius:99px;box-shadow:0 10px 30px rgba(204,255,0,.18);min-height:48px;}
.cta.ghost{background:transparent;color:var(--txt);border:1px solid var(--line);box-shadow:none;}
.stars{display:flex;align-items:center;gap:9px;margin-top:16px;font-size:13px;color:var(--muted);}
.stars .s{color:var(--volt);letter-spacing:1px;}
.stars b{color:var(--txt);}
.hero-art{position:relative;aspect-ratio:1/1;border-radius:22px;overflow:hidden;border:1px solid var(--line);background:var(--bg-2);}
.hero-art img{width:100%;height:100%;object-fit:cover;}
.hero-tag{position:absolute;left:14px;bottom:14px;background:rgba(8,9,10,.82);backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:12px;padding:9px 13px;font-size:12.5px;font-weight:700;}

/* ---------- SECCIONES ---------- */
section{padding:42px 0;}
.sec-head{margin-bottom:20px;}
.sec-head h2{font-size:clamp(23px,4.2vw,34px);}
.sec-head p{color:var(--muted);font-size:14px;margin-top:5px;}
.sec-head .kicker{font-size:12px;font-weight:800;color:var(--hot);letter-spacing:.04em;margin-bottom:6px;}

/* ---------- CARRUSEL ---------- */
.rail-wrap{position:relative;}
.rail{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:8px;scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;}
.rail::-webkit-scrollbar{display:none;}
.rail>*{scroll-snap-align:start;flex:0 0 260px;}
.rail-btn{position:absolute;top:38%;width:38px;height:38px;border-radius:99px;background:rgba(8,9,10,.85);border:1px solid var(--line);display:grid;place-items:center;font-size:18px;z-index:5;}
.rail-btn.prev{left:-6px;}.rail-btn.next{right:-6px;}
@media(max-width:760px){.rail-btn{display:none;}}

/* ---------- CARD PRODUCTO ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px;}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column;}
.card .ph{position:relative;aspect-ratio:1/1;background:var(--bg-2);overflow:hidden;}
.card .ph img{width:100%;height:100%;object-fit:cover;transition:opacity .2s;}
.badges{position:absolute;top:9px;left:9px;display:flex;flex-direction:column;gap:5px;align-items:flex-start;}
.badge{font-size:10.5px;font-weight:800;padding:3px 8px;border-radius:99px;letter-spacing:.02em;}
.badge.top{background:var(--volt);color:#000;}
.badge.new{background:var(--hot);color:#fff;}
.badge.off{background:#fff;color:#000;}
.card-body{padding:13px;display:flex;flex-direction:column;gap:9px;flex:1;}
.card h3{font-size:14.5px;font-weight:700;line-height:1.25;}
.card .cat{font-size:11.5px;color:var(--muted);font-weight:600;}
.price{display:flex;align-items:baseline;gap:8px;}
.price .now{font-family:"Archivo Black";font-size:19px;}
.price .was{color:var(--muted);text-decoration:line-through;font-size:13px;}
.sizes{display:flex;flex-wrap:wrap;gap:6px;}
.size{border:1px solid var(--line);background:var(--bg-2);border-radius:8px;padding:6px 9px;font-size:12.5px;font-weight:700;min-width:38px;min-height:36px;text-align:center;}
.size[aria-pressed="true"]{background:var(--volt);color:#000;border-color:var(--volt);}
.size:disabled{opacity:.28;cursor:not-allowed;text-decoration:line-through;}
.colors{display:flex;flex-wrap:wrap;align-items:center;gap:2px 4px;}
.colors .clbl{flex:0 0 100%;font-size:12px;color:var(--muted);font-weight:600;}
.colors .clbl b{color:var(--txt);font-weight:700;}
.swatch{width:34px;height:34px;border-radius:50%;border:2px solid transparent;display:grid;place-items:center;padding:0;}
.swatch i{display:block;width:22px;height:22px;border-radius:50%;background:var(--c);border:1px solid rgba(255,255,255,.3);}
.swatch[aria-pressed="true"]{border-color:var(--volt);}
.add{margin-top:auto;background:var(--volt);color:#000;font-weight:800;font-size:13.5px;padding:12px;border-radius:10px;width:100%;min-height:44px;}
.add.added{background:var(--ok);color:#04220f;}

/* ---------- GALERÍA ---------- */
.gal{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:8px;scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;}
.gal::-webkit-scrollbar{display:none;}
.gal figure{flex:0 0 210px;scroll-snap-align:start;border-radius:var(--radius);overflow:hidden;border:1px solid var(--line);aspect-ratio:3/4;background:var(--bg-2);}
.gal img{width:100%;height:100%;object-fit:cover;}

/* ---------- BUSCADOR ---------- */
.search{position:relative;margin-bottom:14px;scroll-margin-top:110px;}
.search .ico{position:absolute;left:17px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted);pointer-events:none;}
.search input{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:0 48px 0 46px;min-height:50px;font-size:16px;color:var(--txt);outline:0;-webkit-appearance:none;appearance:none;}
.search input::placeholder{color:var(--muted);}
.search input::-webkit-search-cancel-button,.search input::-webkit-search-decoration{-webkit-appearance:none;display:none;}
.search input:focus{border-color:var(--volt);box-shadow:0 0 0 3px rgba(204,255,0,.14);}
.search.on input{border-color:var(--volt);}
.search .clr{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:34px;height:34px;border-radius:50%;background:var(--bg-2);border:1px solid var(--line);display:none;place-items:center;font-size:13px;line-height:1;}
.search.on .clr{display:grid;}

/* ---------- FILTROS ---------- */
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:18px;}
.filters .lbl{font-size:12.5px;color:var(--muted);font-weight:600;margin-right:2px;}
.fbtn{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:8px 14px;font-size:13px;font-weight:700;min-height:38px;}
.fbtn[aria-pressed="true"]{background:var(--txt);color:#000;border-color:var(--txt);}
.filters .tools{flex:0 0 100%;display:flex;flex-wrap:wrap;align-items:center;gap:8px;}
.tools .sel{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:0 6px 0 14px;min-height:38px;}
.tools .sel:focus-within{outline:2px solid var(--volt);outline-offset:2px;}
.tools .sel.on{border-color:var(--volt);}
.tools .sel span{font-size:12.5px;color:var(--muted);font-weight:600;}
.tools .sel select{-webkit-appearance:none;appearance:none;background-color:transparent;border:0;outline:0;color:var(--txt);font-weight:700;font-size:13px;min-height:36px;padding:0 24px 0 2px;cursor:pointer;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='9'><path d='M1 1l6 6 6-6' stroke='%238d949c' stroke-width='1.6' fill='none'/></svg>");background-repeat:no-repeat;background-position:right 6px center;}
.tools .sel select option{background:var(--bg-2);color:var(--txt);}
.tools .count{font-size:12.5px;color:var(--muted);font-weight:600;margin-left:2px;}
.tools .size-guide{margin-left:auto;}
.clear-filters{margin-top:10px;}
@media(max-width:760px){.tools .sel select{font-size:16px;}}
.fbtn.size-guide{background:transparent;color:var(--volt);border-color:rgba(204,255,0,.4);}

/* ---------- TRUST ---------- */
.trust{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:22px 0;}
.trust div{text-align:center;}
.trust .ico{font-size:22px;display:block;margin-bottom:4px;}
.trust b{font-size:13.5px;}

/* ---------- FOOTER ---------- */
footer{padding:38px 0 30px;color:var(--muted);font-size:13px;}
footer .flogo{font-family:"Archivo Black";font-size:17px;color:var(--txt);text-transform:uppercase;}
footer .tagline{margin:4px 0 18px;}
.flinks{display:grid;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;margin-bottom:20px;}
.flinks button{background:var(--surface);text-align:left;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--txt);font-weight:600;min-height:48px;}
.flinks button span.arrow{color:var(--muted);}
footer .fine{border-top:1px solid var(--line);padding-top:14px;font-size:12px;}

/* ---------- ZOOM DE PRODUCTOS ---------- */
.product-zoom{position:fixed;inset:0;z-index:250;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(0,0,0,.88);backdrop-filter:blur(6px);cursor:zoom-out;}
.product-zoom.open{display:flex;}
.product-zoom img{max-width:min(94vw,1100px);max-height:90vh;width:auto;height:auto;object-fit:contain;border-radius:14px;box-shadow:0 20px 70px rgba(0,0,0,.65);cursor:default;}
.product-zoom-close{position:absolute;top:18px;right:18px;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:rgba(21,24,27,.92);border:1px solid var(--line);color:var(--txt);font-size:24px;z-index:2;}
.card .ph{cursor:zoom-in;}

/* ---------- MODALES ---------- */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.72);backdrop-filter:blur(3px);z-index:80;display:none;overscroll-behavior:contain;}
.overlay.open{display:block;}
.modal{position:fixed;z-index:90;left:50%;top:50%;transform:translate(-50%,-50%);width:min(620px,94vw);max-height:86vh;overflow-y:auto;background:var(--bg-2);border:1px solid var(--line);border-radius:18px;padding:22px;display:none;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;}
.modal.open{display:block;}
.modal h3{font-family:"Archivo Black";font-size:19px;text-transform:uppercase;margin-bottom:14px;padding-right:34px;}
.modal h4{font-size:14px;margin:16px 0 5px;color:var(--volt);}
.modal p,.modal li{font-size:14px;color:#cfd3d7;}
.modal ol,.modal ul{padding-left:18px;}
.modal li{margin:4px 0;}
.x{position:absolute;top:16px;right:16px;width:36px;height:36px;border-radius:99px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;font-size:15px;}
.pill-grid{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;}
.pill{background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:4px 10px;font-size:12px;}
.stat-row{display:flex;gap:12px;margin-top:10px;}
.stat{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center;}
.stat b{display:block;font-family:"Archivo Black";font-size:20px;color:var(--volt);}
.stat small{font-size:11.5px;color:var(--muted);}
table.tallas{width:100%;border-collapse:collapse;margin-top:10px;font-size:13.5px;}
table.tallas th,table.tallas td{border:1px solid var(--line);padding:8px;text-align:center;}
table.tallas th{background:var(--surface);font-size:12px;color:var(--volt);}
.note{color:var(--muted);font-size:12px;margin-top:8px;}

/* ---------- CARRITO ---------- */
.drawer{
  position:fixed;top:0;right:0;
  height:100vh;height:100dvh;
  width:min(430px,100vw);
  background:var(--bg-2);border-left:1px solid var(--line);z-index:95;
  transform:translateX(102%);transition:transform .28s ease;
  display:flex;flex-direction:column;
  overscroll-behavior:contain;
}
.drawer.open{transform:none;}
.drawer-top{padding:calc(14px + env(safe-area-inset-top)) 16px 14px;border-bottom:1px solid var(--line);flex-shrink:0;}
.drawer-top .row{display:flex;justify-content:space-between;align-items:center;gap:10px;}
.drawer-top h3{font-family:"Archivo Black";font-size:18px;text-transform:uppercase;}
.steps{display:flex;gap:6px;margin-top:12px;}
.step{flex:1;font-size:11px;font-weight:700;text-align:center;padding:7px 4px;border-radius:8px;background:var(--surface);color:var(--muted);border:1px solid var(--line);}
.step.on{background:var(--volt);color:#000;border-color:var(--volt);}
.drawer-body{flex:1;overflow-y:auto;padding:16px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;min-height:0;}
.drawer-foot{padding:14px 16px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--bg-2);flex-shrink:0;}
.ci{display:flex;gap:11px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:10px;}
.ci img{width:62px;height:62px;border-radius:9px;object-fit:cover;background:var(--bg-2);flex-shrink:0;}
.ci .info{flex:1;min-width:0;}
.ci h4{font-size:13.5px;font-weight:700;}
.ci small{color:var(--muted);font-size:12px;}
.qty{display:flex;align-items:center;gap:10px;margin-top:7px;}
.qty button{width:32px;height:32px;border-radius:8px;background:var(--bg-2);border:1px solid var(--line);font-weight:800;font-size:15px;display:grid;place-items:center;}
.qty span{font-size:13.5px;font-weight:700;min-width:18px;text-align:center;}
.ci .rm{color:var(--muted);font-size:12px;text-decoration:underline;margin-top:6px;display:inline-block;padding:4px 0;}
.empty{text-align:center;padding:46px 10px;color:var(--muted);}
.empty .big{font-size:40px;display:block;margin-bottom:10px;}
.nudge{background:rgba(255,29,88,.1);border:1px solid rgba(255,29,88,.35);border-radius:12px;padding:12px;font-size:13px;margin-bottom:12px;}
.nudge b{color:var(--hot);display:block;font-size:12px;margin-bottom:3px;}
.field{margin-bottom:12px;}
.field label{display:block;font-size:12.5px;font-weight:700;margin-bottom:5px;}
.field input,.field select,.field textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;font-size:16px;min-height:46px;}
.field textarea{min-height:70px;resize:vertical;}
.field select{-webkit-appearance:none;appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='9'><path d='M1 1l6 6 6-6' stroke='%238d949c' stroke-width='1.6' fill='none'/></svg>");background-repeat:no-repeat;background-position:right 14px center;padding-right:34px;}
.field .err{color:var(--hot);font-size:11.5px;display:none;margin-top:4px;}
.field.bad input,.field.bad select{border-color:var(--hot);}
.field.bad .err{display:block;}
.totals{font-size:13.5px;margin-bottom:10px;}
.totals .r{display:flex;justify-content:space-between;padding:3px 0;}
.totals .r.sum{border-top:1px solid var(--line);margin-top:6px;padding-top:8px;font-size:17px;font-weight:800;font-family:"Archivo Black";}
.totals .disc{color:var(--volt);}
.wbtn{width:100%;background:var(--ok);color:#04220f;font-weight:800;font-size:15px;padding:15px;border-radius:12px;display:flex;align-items:center;justify-content:center;gap:8px;min-height:50px;}
.wbtn:disabled{opacity:.55;}
.wbtn.alt{background:transparent;color:var(--ok);border:1px solid rgba(37,211,102,.45);font-size:14px;padding:11px;min-height:44px;margin-top:8px;}
.mpbtn{width:100%;background:#009ee3;color:#fff;font-weight:800;font-size:15px;padding:15px;border-radius:12px;display:flex;align-items:center;justify-content:center;gap:8px;min-height:50px;}
.mpbtn:disabled{opacity:.65;}
.pay-err{color:#ff6b8a;font-size:12.5px;font-weight:600;text-align:center;margin-bottom:8px;}
.pay-err:empty{display:none;}
.lbtn{width:100%;background:var(--volt);color:#000;font-weight:800;font-size:15px;padding:15px;border-radius:12px;min-height:50px;}
.tbtn{width:100%;background:transparent;color:var(--muted);font-size:13px;padding:12px;min-height:40px;}
.secure{text-align:center;font-size:11.5px;color:var(--muted);margin-top:9px;}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translate(-50%,120%);background:var(--volt);color:#000;font-weight:800;font-size:13.5px;padding:12px 20px;border-radius:99px;z-index:200;transition:transform .3s;box-shadow:0 12px 30px rgba(0,0,0,.5);max-width:90vw;text-align:center;}
.toast.show{transform:translate(-50%,0);}

/* ---------- RESPONSIVE ---------- */
@media(max-width:880px){
  .hero-grid{grid-template-columns:1fr;gap:24px;}
  .hero-art{order:-1;aspect-ratio:4/3;}
  .trust{grid-template-columns:1fr;text-align:left;}
  .trust div{display:flex;align-items:center;gap:10px;text-align:left;}
  .trust .ico{margin:0;font-size:19px;}
}
@media(max-width:560px){
  .hdr{height:56px;}
  .btn-wsp span.t{display:none;}
  .grid{grid-template-columns:repeat(2,1fr);gap:10px;}
  .card-body{padding:10px;gap:7px;}
  .card h3{font-size:13px;}
  .price .now{font-size:16px;}
  .size{padding:5px 7px;font-size:11.5px;min-width:34px;min-height:34px;}
  .add{font-size:12.5px;padding:11px;}
  .rail>*{flex:0 0 205px;}
  section{padding:32px 0;}
  .drawer{width:100vw;}
}

<body>

<div class="ticker" id="ticker"></div>

<header>
  <div class="wrap hdr">
    <div class="logo" id="logoTxt"></div>
    <div class="hdr-right">
      <a class="btn-wsp" id="wspTop" target="_blank" rel="noopener">💬 <span class="t">Contacto</span></a>
      <button class="btn-cart" id="searchBtn" aria-label="Buscar productos">🔍</button>
      <button class="btn-cart" id="cartBtn">🛒 <span class="count" id="cartCount">0</span></button>
    </div>
  </div>
  <div class="promo-strip" id="promoStrip"></div>
</header>

<!-- ============ HERO ============ -->
<div class="hero">
  <div class="wrap hero-grid">
    <div>
      <div class="eyebrow" id="heroEyebrow"></div>
      <h1 class="display" id="heroTitle"></h1>
      <p class="lead" id="heroLead"></p>
      <div class="chips" id="heroChips"></div>
      <div class="promo-box">
        <h3 id="promoTitle"></h3>
        <div class="promo-rows" id="promoRows"></div>
        <small id="promoNote"></small>
      </div>
      <a href="#catalogo" class="cta" id="heroCta"></a>
      <div class="stars"><span class="s">★★★★★</span> <b id="ratingVal"></b> <span id="ratingTxt"></span></div>
    </div>
    <div class="hero-art">
      <img id="heroImg" alt="Botines destacados">
      <div class="hero-tag" id="heroTag"></div>
    </div>
  </div>
</div>

<!-- ============ MÁS VENDIDOS ============ -->
<section>
  <div class="wrap">
    <div class="sec-head">
      <div class="kicker" id="railKicker"></div>
      <h2 class="display" id="railTitle"></h2>
      <p id="railSub"></p>
    </div>
    <div class="rail-wrap">
      <button class="rail-btn prev" id="railPrev" aria-label="Anterior">‹</button>
      <div class="rail" id="rail"></div>
      <button class="rail-btn next" id="railNext" aria-label="Siguiente">›</button>
    </div>
  </div>
</section>

<!-- ============ GALERÍA ============ -->
<section style="padding-top:0">
  <div class="wrap">
    <div class="sec-head">
      <h2 class="display" id="galTitle"></h2>
      <p id="galSub"></p>
    </div>
    <div class="gal" id="gal"></div>
  </div>
</section>

<!-- ============ CATÁLOGO ============ -->
<section id="catalogo">
  <div class="wrap">
    <div class="sec-head">
      <h2 class="display" id="catTitle"></h2>
      <p id="catSub"></p>
    </div>
    <div class="search" id="searchBox" role="search">
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="busq" type="search" placeholder="Buscar botín, marca o color…" aria-label="Buscar productos" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search">
      <button class="clr" id="busqClr" type="button" aria-label="Borrar búsqueda">✕</button>
    </div>
    <div class="filters" id="filters"></div>
    <div class="grid" id="grid"></div>
  </div>
</section>

<!-- ============ TRUST ============ -->
<div class="wrap"><div class="trust" id="trust"></div></div>

<!-- ============ FOOTER ============ -->
<footer>
  <div class="wrap">
    <div class="flogo" id="footLogo"></div>
    <div class="tagline" id="footTag"></div>
    <div class="flinks" id="flinks"></div>
    <div class="fine" id="footFine"></div>
  </div>
</footer>

<div class="overlay" id="overlay"></div>

<!-- MODAL INFO -->
<div class="modal" id="infoModal" role="dialog" aria-modal="true">
  <button class="x" data-close aria-label="Cerrar">✕</button>
  <h3 id="infoTitle"></h3>
  <div id="infoBody"></div>
</div>

<!-- MODAL TALLES -->
<div class="modal" id="sizeModal" role="dialog" aria-modal="true">
  <button class="x" data-close aria-label="Cerrar">✕</button>
  <h3>📏 Guía de talles</h3>
  <p style="font-size:13px;color:var(--muted)">Medí tu pie apoyado contra la pared, del talón al dedo más largo.</p>
  <table class="tallas"><thead><tr><th>ARG</th><th>EU</th><th>US</th><th>Pie (cm)</th></tr></thead><tbody id="sizeTable"></tbody></table>
  <p class="note" id="sizeNote"></p>
</div>

<!-- CARRITO -->
<aside class="drawer" id="drawer" aria-label="Tu pedido" role="dialog" aria-modal="true">
  <div class="drawer-top">
    <div class="row"><h3>Tu pedido</h3><button class="x" style="position:static" data-close aria-label="Cerrar">✕</button></div>
    <div class="steps">
      <div class="step on" data-step="1">1 · Carrito</div>
      <div class="step" data-step="2">2 · Datos</div>
      <div class="step" data-step="3">3 · Listo</div>
    </div>
  </div>
  <div class="drawer-body" id="drawerBody"></div>
  <div class="drawer-foot" id="drawerFoot"></div>
</aside>

<!-- Visor ampliado de imágenes de productos -->
<div class="product-zoom" id="productZoom" role="dialog" aria-modal="true" aria-label="Imagen ampliada">
  <button class="product-zoom-close" id="productZoomClose" aria-label="Cerrar imagen">×</button>
  <img id="productZoomImg" alt="Imagen ampliada del producto">
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

// Imagen de reemplazo cuando no hay foto cargada
function placeholder(txt="BOTÍN", ratio="1/1", tint=null){
  const w = 600, h = ratio==="3/4" ? 800 : 600;
  const esc = x => String(x).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  const t = esc(String(txt).slice(0,22).toUpperCase());
  const path1 = "M-135 30 C-120 -25 -90 -45 -55 -40 C-25 -36 -5 -18 25 -4 C60 12 100 16 128 26 C142 31 146 44 140 54 L-128 54 C-138 54 -140 44 -135 30 Z";
  const studs = "M-80 -30 L-60 10 M-50 -34 L-32 6 M-20 -24 L-6 12";
  let defsExtra = "", shoe, sub;
  if(tint && tint.hex){
    // Botín pintado con el color elegido (uno o dos colores)
    const c1 = Array.isArray(tint.hex) ? tint.hex[0] : tint.hex;
    const c2 = Array.isArray(tint.hex) ? tint.hex[1] : null;
    const m = /^#?([0-9a-f]{6})$/i.exec(String(c1).trim());
    const lum = m ? (parseInt(m[1].slice(0,2),16)*.299 + parseInt(m[1].slice(2,4),16)*.587 + parseInt(m[1].slice(4,6),16)*.114)/255 : 0;
    const marca = lum > .6 ? "#000" : "#fff";
    if(c2) defsExtra = `<linearGradient id="c" x1="0" y1="0" x2="1" y2="1"><stop offset=".5" stop-color="${c1}"/><stop offset=".5" stop-color="${c2}"/></linearGradient>`;
    shoe = `<g transform="translate(${w/2},${h/2 - 20})" stroke-linejoin="round" stroke-linecap="round" stroke-width="7">
    <path d="${path1}" fill="${c2 ? "url(#c)" : c1}" stroke="#fff" stroke-opacity=".5"/>
    <path d="M-128 54 L140 54" fill="none" stroke="#fff" stroke-opacity=".3"/>
    <path d="${studs}" fill="none" stroke="${marca}" stroke-opacity=".4" stroke-width="5"/>
  </g>`;
    sub = `<text x="50%" y="${h - 28}" text-anchor="middle" fill="#9aa1a8" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="bold">${esc(tint.nombre||"")}</text>`;
  } else {
    shoe = `<g transform="translate(${w/2},${h/2 - 20})" fill="none" stroke="#ccff00" stroke-opacity=".55" stroke-width="7" stroke-linejoin="round" stroke-linecap="round">
    <path d="${path1}"/>
    <path d="M-128 54 L140 54" stroke-opacity=".3"/>
    <path d="${studs}" stroke-width="5" stroke-opacity=".45"/>
  </g>`;
    sub = `<text x="50%" y="${h - 28}" text-anchor="middle" fill="#3d4349" font-family="Arial,Helvetica,sans-serif" font-size="18">cargá tu foto acá</text>`;
  }
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">
  <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#16191c"/><stop offset="1" stop-color="#0b0d0f"/></linearGradient>${defsExtra}</defs>
  <rect width="${w}" height="${h}" fill="url(#g)"/>
  ${shoe}
  <text x="50%" y="${h - 58}" text-anchor="middle" fill="#6d747b" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="bold" letter-spacing="2">${t}</text>
  ${sub}
</svg>`;
  return "data:image/svg+xml;utf8," + encodeURIComponent(svg);
}

function setImg(el, src, fallbackTxt, ratio, tint){

  el.onerror = ()=>{ el.onerror=null; el.src=fb; };

/* ---------- Bloqueo de scroll de fondo (clave para que el carrito
   funcione bien en mobile: sin esto, la página de atrás se mueve
   al arrastrar el dedo sobre el overlay o el drawer) ---------- */
let _scrollY = 0, _lockCount = 0;
function lockBody(){
  if(_lockCount === 0){
    _scrollY = window.scrollY || window.pageYOffset || 0;
    document.body.style.top = (-_scrollY) + "px";
    document.body.classList.add("lock");
  }
  _lockCount++;
}
function unlockBody(){
  _lockCount = Math.max(0, _lockCount - 1);
  if(_lockCount === 0){
    // html tiene scroll-behavior:smooth; sin desactivarlo, el scrollTo
    // se anima desde arriba (0) hasta la posición guardada y parece que
    // la página "sube". Lo forzamos a instantáneo solo en este momento.
    const root = document.documentElement;
    const prevBehavior = root.style.scrollBehavior;
    root.style.scrollBehavior = "auto";
    document.body.classList.remove("lock");
    document.body.style.top = "";
    window.scrollTo(0, _scrollY);
    root.style.scrollBehavior = prevBehavior;
  }
}

// Stock de talles según el color
const tieneT = (arr,t) => (arr||[]).some(x=>String(x)===String(t));
// ¿Hay stock del talle t en el color c? (c = objeto color o null → stock general del producto)
function talleOk(p,t,c){
  if(c){
    if(Array.isArray(c.talles) && !tieneT(c.talles,t)) return false;
    return !tieneT(Array.isArray(c.sinStock) ? c.sinStock : p.sinStock, t);
  }
  return !tieneT(p.sinStock,t);
}
// Disponibilidad a mostrar: con color elegido, la de ese color; sin color, la de "algún color"
function talleDisp(p,t,c){
  const cols = p.colores || [];
  if(c || !cols.length) return talleOk(p,t,c);
  return cols.some(k=>talleOk(p,t,k));
}

// Buscador: sin distinguir mayúsculas ni tildes; todas las palabras deben aparecer
// en el nombre, la categoría o los colores del producto.
let busqueda = "";
const sinAcentos = t => String(t||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
const textoBusqueda = p => sinAcentos([p.nombre, p.cat, ...(p.colores||[]).map(c=>c.nombre)].join(" "));
const escBusq = t => t.replace(/[&<>"']/g, ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));

function render(){
  let lista = CONFIG.productos.slice();
  if(filtro==="top")   lista = lista.filter(p=>p.top);
  if(filtro==="nuevo") lista = lista.filter(p=>p.nuevo);
  if(CONFIG.categorias.includes(filtro)) lista = lista.filter(p=>p.cat===filtro);
  const palabras = sinAcentos(busqueda).split(/\s+/).filter(Boolean);
  if(palabras.length) lista = lista.filter(p=>{ const t = textoBusqueda(p); return palabras.every(w=>t.includes(w)); });
  if(rangoPrecio >= 0){
    const r = RANGOS[rangoPrecio];
    lista = lista.filter(p=> (r.min==null || p.precio>=r.min) && (r.max==null || p.precio<=r.max));
  }
  const porNombre = (a,b)=>collator.compare(a.nombre, b.nombre);
  if(orden==="az")          lista.sort(porNombre);
  if(orden==="precio-asc")  lista.sort((a,b)=>a.precio-b.precio || porNombre(a,b));
  if(orden==="precio-desc") lista.sort((a,b)=>b.precio-a.precio || porNombre(a,b));
  pintar($("#grid"), lista);
  const n = lista.length;
  $("#resCount").textContent = n + (n===1 ? " producto" : " productos");
  if(!n) $("#grid").innerHTML = `<div style="grid-column:1/-1;color:var(--muted)">${busqueda.trim() ? `No encontramos resultados para <b style="color:var(--txt)">“${escBusq(busqueda.trim())}”</b>.` : "No hay productos con esos filtros."}<br><button class="fbtn clear-filters">Quitar filtros</button></div>`;
}

/* ---------- Stock automático del proveedor ---------- */
// Pinta la página al toque con el stock "de fábrica" (arriba), y apenas
// llega la respuesta del proveedor, la actualiza con el stock real.
// Si el proveedor no responde o algo falla, la página sigue funcionando
// igual, con el stock que ya tenía cargado.
function aplicarStockProveedor(porImagen){
  if(!porImagen) return;
  CONFIG.productos.forEach(p=>{
    if(p.colores && p.colores.length){
      p.colores.forEach(c=>{
        const info = porImagen[c.img || p.img];
        if(!info) return; // sin match: dejamos el stock que ya tenía cargado
        const disponibles = p.talles.filter(t => (info[t]||0) > 0);
        c.sinStock = p.talles.filter(t => !disponibles.includes(t));
        delete c.talles; // el sinStock recién calculado ya define todo
      });
    } else {
      const info = porImagen[p.img];
      if(!info) return;
      const disponibles = p.talles.filter(t => (info[t]||0) > 0);
      p.sinStock = p.talles.filter(t => !disponibles.includes(t));
    }
  });
}

// Suma al catálogo los productos que el proveedor tiene y nosotros todavía no
// (mismo criterio que el servidor: se identifican por foto, para no duplicar
// nada que ya hayas cargado vos a mano).
function agregarProductosNuevos(nuevos){
  if(!Array.isArray(nuevos) || !nuevos.length) return;
  const fotosPropias = new Set();
  CONFIG.productos.forEach(p=>{
    if(p.img) fotosPropias.add(p.img);
    (p.colores||[]).forEach(c=>{ if(c.img) fotosPropias.add(c.img); });
  });
  nuevos.forEach(n=>{
    if(fotosPropias.has(n.img)) return; // ya lo tenés cargado, no lo duplicamos
    if(CONFIG.productos.some(p=>p.id===n.id)) return;
    CONFIG.productos.push(n);
    fotosPropias.add(n.img);
  });
}

      aplicarStockProveedor(data.porImagen);

    })
    .catch(()=>{ /* seguimos con el catálogo de fábrica, sin romper la página */ });
}

document.addEventListener("click",e=>{ const img=e.target.closest(".card .ph img"); if(img){e.preventDefault();e.stopPropagation();openProductZoom(img);} });
productZoomClose.addEventListener("click",closeProductZoom);
productZoom.addEventListener("click",e=>{if(e.target===productZoom)closeProductZoom();});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeProductZoom();});

/* ---------- Carrito ---------- */
let cart = [];
try{ const raw = localStorage.getItem("cart_botines"); if(raw) cart = JSON.parse(raw)||[]; }catch(e){}
function save(){ try{ localStorage.setItem("cart_botines", JSON.stringify(cart)); }catch(e){} }

// Datos del formulario de envío, guardados en cada tecleo para no
// perderlos si el usuario vuelve al paso 1 y avanza otra vez.
let formData = {};
try{ formData = JSON.parse(localStorage.getItem("datos_botines") || "{}"); }catch(e){ formData = {}; }
function saveFormField(id, val){ formData[id] = val; try{ localStorage.setItem("datos_botines", JSON.stringify(formData)); }catch(e){} }

let step = 1;
const drawer = $("#drawer"), overlay = $("#overlay");

function addToCart(id,size,color=""){
  const found = cart.find(i=>i.id===id && i.size===size && (i.color||"")===color);
  if(found) found.qty++;
  else cart.push({id,size,color,qty:1});
  save(); updateCount(); toast("Agregado al pedido 🛒");
  if(drawer.classList.contains("open")) drawerRender();
}
function updateCount(){ $("#cartCount").textContent = cart.reduce((a,i)=>a+i.qty,0); }
updateCount();

// Descuento: se cuenta por rubro (categoría). 2 del mismo rubro = 10%, 3 o más = 15%
function calc(){
  const porCat = {};
  cart.forEach(i=>{ const p=P(i.id); if(!p) return; porCat[p.cat]=(porCat[p.cat]||0)+i.qty; });
  let sub=0, desc=0;
  cart.forEach(i=>{
    const p=P(i.id); if(!p) return;
    const n = porCat[p.cat];
    let pct = 0;
    CONFIG.promos.forEach((pr,idx)=>{ if(n >= idx+2) pct = pr.off; });
    sub += p.precio*i.qty;
    desc += p.precio*i.qty*pct/100;
  });
  return { sub, desc:Math.round(desc), porCat };
}
function faltaPara(){
  const {porCat} = calc();
  for(const cat in porCat){
    const n = porCat[cat];
    if(n===1) return {cat, off:CONFIG.promos[0].off, faltan:1};
    if(n===2 && CONFIG.promos[1]) return {cat, off:CONFIG.promos[1].off, faltan:1};
  }
  return null;
}

function scrollDrawerTop(){ const b=$("#drawerBody"); if(b) b.scrollTop = 0; }

function drawerRender(){
  $$(".step").forEach(s=>s.classList.toggle("on", +s.dataset.step===step));
  const body=$("#drawerBody"), foot=$("#drawerFoot");
  const {sub,desc}=calc();

  if(step===3){ pintarPaso3(body, foot); return; }

  if(!cart.length){
    body.innerHTML = `<div class="empty"><span class="big">🛒</span><b>Tu pedido está vacío</b><br><small>Agregá un par para empezar</small></div>`;
    foot.innerHTML = `<button class="lbtn" data-close>Ver los botines 🔥</button>`;
    return;
  }

  if(step===1){
    const zona0 = CONFIG.zonas.find(z=>z.nombre===formData.zona);
    const envio0 = zona0 ? zona0.costo : CONFIG.zonas[0].costo;
    const n = faltaPara();
    body.innerHTML =
      (n?`<div class="nudge"><b>🔥 Te falta 1 para la promo</b>Agregá otro de "${n.cat}" y te llevás ${n.off}% OFF en los dos.</div>`:"") +
      cart.map((i,ix)=>{
        const p=P(i.id); if(!p) return "";
        return `<div class="ci">
          <img data-ci="${ix}" alt="${p.nombre}">
          <div class="info">
            <h4>${p.nombre}</h4>
            <small>${i.color?`Color ${i.color} · `:""}Talle ${i.size} · ${money(p.precio)}</small>
            <div class="qty">
              <button data-dec="${ix}" aria-label="Quitar uno">−</button>
              <span>${i.qty}</span>
              <button data-inc="${ix}" aria-label="Agregar uno">+</button>
            </div>
            <button class="rm" data-rm="${ix}">Quitar</button>
          </div>
        </div>`;
      }).join("");
    cart.forEach((i,ix)=>{ const im=$(`[data-ci="${ix}"]`,body); const p=P(i.id); if(im&&p) setImg(im,imgDe(p,i.color),p.nombre,undefined,colorDe(p,i.color)); });
    foot.innerHTML = `
      <div class="totals">
        <div class="r"><span>Subtotal</span><span>${money(sub)}</span></div>
        ${desc?`<div class="r disc"><span>Descuento promo</span><span>−${money(desc)}</span></div>`:""}
        <div class="r"><span>Envío</span><span>${money(envio0)}</span></div>
        <div class="r sum"><span>Total</span><span>${money(sub-desc+envio0)}</span></div>
      </div>
      <button class="lbtn" id="goStep2">Continuar pedido →</button>
      <button class="tbtn" data-close>← Seguir comprando</button>`;
    $("#goStep2").onclick = ()=>{ step=2; drawerRender(); scrollDrawerTop(); };
  }

  if(step===2){
    body.innerHTML = `
      <h4 style="font-size:14px;margin-bottom:10px">📍 Datos de envío</h4>
      <div class="field" id="f-nombre"><label>Nombre y apellido *</label><input id="nombre" placeholder="Juan Pérez" autocomplete="name"><span class="err">Completá tu nombre</span></div>
      <div class="field"><label>Instagram (opcional)</label><input id="ig" placeholder="@usuario" autocomplete="off"></div>
      <div class="field" id="f-tel"><label>Teléfono / WhatsApp *</label><input id="tel" type="tel" inputmode="tel" placeholder="11 2345 6789" autocomplete="tel"><span class="err">Completá tu teléfono</span></div>
      <div class="field" id="f-zona"><label>Zona de envío *</label>
        <select id="zona"><option value="">— Elegí tu zona —</option>
        ${CONFIG.zonas.map(z=>`<option value="${z.nombre}">${z.nombre} (${money(z.costo)})</option>`).join("")}
        </select><span class="err">Elegí una zona</span></div>
      <div class="field" id="f-dir"><label>Dirección *</label><input id="dir" placeholder="Calle y número" autocomplete="street-address"><span class="err">Completá la dirección</span></div>
      <div class="field" id="f-barrio"><label>Barrio / Localidad *</label><input id="barrio" placeholder="Ej: Villa Urquiza" autocomplete="address-level2"><span class="err">Completá tu barrio</span></div>
      <div class="field"><label>Aclaraciones</label><textarea id="acl" placeholder="Timbre, horario preferido, referencia..."></textarea></div>`;
    // restaurar datos guardados (de este pedido o de un pedido anterior)
    ["nombre","ig","tel","zona","dir","barrio","acl"].forEach(k=>{ if(formData[k] && $("#"+k)) $("#"+k).value = formData[k]; });
    $("#zona").onchange = ()=>{ saveFormField("zona", $("#zona").value); drawerFoot2(); };
    drawerFoot2();
  }

  function drawerFoot2(){
    const z = CONFIG.zonas.find(x=>x.nombre===($("#zona")?$("#zona").value:"")) || null;
    const env = z ? z.costo : 0;
    const usaMP = !!CONFIG.pagoMercadoPago, usaWA = !!CONFIG.pagoWhatsApp || !usaMP;
    const seguro = usaMP && usaWA ? "Pagás online con Mercado Pago o en efectivo al recibir 🔐"
                 : usaMP ? "Pago seguro con Mercado Pago 🔐"
                 : "Sin adelanto · Pagás cuando llega 🔐";
    $("#drawerFoot").innerHTML = `
      <div class="totals">
        <div class="r"><span>Productos</span><span>${money(sub-desc)}</span></div>
        <div class="r"><span>Envío</span><span>${z?money(env):"a definir"}</span></div>
        <div class="r sum"><span>Total</span><span>${money(sub-desc+env)}</span></div>
      </div>
      <p class="pay-err" id="payErr" role="alert"></p>
      ${usaMP?`<button class="mpbtn" id="payMP">${MP_LABEL}</button>`:""}
      ${usaWA?`<button class="wbtn${usaMP?" alt":""}" id="finish">${usaMP?"💬 Pedir por WhatsApp · efectivo al recibir":"💬 Finalizar por WhatsApp"}</button>`:""}
      <button class="tbtn" id="back1">← Volver al carrito</button>
      <p class="secure">${seguro}</p>`;
    $("#back1").onclick=()=>{ step=1; drawerRender(); scrollDrawerTop(); };
    if(usaMP) $("#payMP").onclick = pagarMP;
    if(usaWA) $("#finish").onclick = finalizar;
  }

}

// Guarda cada campo del formulario mientras el usuario escribe, así
// no se pierde nada si vuelve al paso 1 o cierra el carrito por error.
$("#drawerBody").addEventListener("input", e=>{
  const el = e.target;
  if(el.matches("#nombre,#ig,#tel,#dir,#barrio,#acl,#zona")) saveFormField(el.id, el.value);
});

// En mobile, cuando el teclado tapa el campo que se está completando,
// lo llevamos a la vista para que el usuario siga viendo lo que escribe.
$("#drawerBody").addEventListener("focusin", e=>{
  if(e.target.matches("input,select,textarea")){
    setTimeout(()=> e.target.scrollIntoView({block:"center", behavior:"smooth"}), 280);
  }
});

let lastLink = "https://wa.me/"+CONFIG.whatsapp;
let resultadoPago = null;   // resultado al volver de Mercado Pago (null = flujo normal de WhatsApp)
const MP_LABEL = "💳 Pagar con Mercado Pago";

// Valida el formulario de envío y devuelve los datos (o null si falta algo)
function leerFormulario(){
  const req = [["nombre","f-nombre"],["tel","f-tel"],["zona","f-zona"],["dir","f-dir"],["barrio","f-barrio"]];
  let ok = true, firstBad = null;
  req.forEach(([id,f])=>{
    const bad = !$("#"+id).value.trim();
    $("#"+f).classList.toggle("bad", bad);
    if(bad){ ok=false; if(!firstBad) firstBad = id; }
  });
  if(!ok){
    toast("Faltan datos obligatorios");
    if(firstBad) $("#"+firstBad).scrollIntoView({block:"center", behavior:"smooth"});
    return null;
  }
  const d = { nombre:$("#nombre").value.trim(), ig:$("#ig").value.trim(), tel:$("#tel").value.trim(),
              zona:$("#zona").value, dir:$("#dir").value.trim(), barrio:$("#barrio").value.trim(), acl:$("#acl").value.trim() };
  formData = d;
  try{ localStorage.setItem("datos_botines", JSON.stringify(d)); }catch(e){}
  return d;
}

// Foto del pedido tal cual está en este momento (se usa para WhatsApp y para Mercado Pago)
function armarPedido(d){
  const {sub,desc}=calc();
  const envio = (CONFIG.zonas.find(z=>z.nombre===d.zona)||{costo:0}).costo;
  const lineas = cart.map(i=>{ const p=P(i.id); return `• ${p.nombre}${i.color?` — Color ${i.color}`:""} — Talle ${i.size} × ${i.qty} — ${money(p.precio*i.qty)}`; });
  return { d, lineas, sub, desc, envio, total: sub-desc+envio };
}

function textoPedido(ped, saludo, pagoLinea){
  const d = ped.d;
  return `${saludo}

${ped.lineas.join("\n")}

Subtotal: ${money(ped.sub)}${ped.desc?`\nDescuento promo: -${money(ped.desc)}`:""}
Envío (${d.zona}): ${money(ped.envio)}
TOTAL: ${money(ped.total)}

📍 Datos de envío
Nombre: ${d.nombre}
Teléfono: ${d.tel}${d.ig?`\nInstagram: ${d.ig}`:""}
Dirección: ${d.dir}
Barrio: ${d.barrio}${d.acl?`\nAclaraciones: ${d.acl}`:""}

${pagoLinea}`;
}

/* ---------- Pago en efectivo: pedido por WhatsApp ---------- */
function finalizar(){
  const d = leerFormulario(); if(!d) return;

  const finishBtn = $("#finish");
  if(finishBtn){ finishBtn.disabled = true; finishBtn.textContent = "Abriendo WhatsApp…"; }

  const ped = armarPedido(d);
  lastLink = "https://wa.me/"+CONFIG.whatsapp+"?text="+encodeURIComponent(
    textoPedido(ped, "¡Hola! Quiero hacer este pedido 👟", "Pago en efectivo al recibir ✅"));
  window.open(lastLink,"_blank");
  resultadoPago = null; step=3; drawerRender(); scrollDrawerTop();
}

/* ---------- Pago online: Mercado Pago ---------- */
function errorPago(msg){ const e=$("#payErr"); if(e) e.textContent = msg||""; }

async function pagarMP(){
  const d = leerFormulario(); if(!d) return;
  const btn = $("#payMP"), btnWA = $("#finish");
  const bloquear = on => {
    if(btn){ btn.disabled = on; btn.textContent = on ? "Conectando con Mercado Pago…" : MP_LABEL; }
    if(btnWA) btnWA.disabled = on;
  };
  errorPago(""); bloquear(true);

  const ped = armarPedido(d);
  const ctl = new AbortController();
  const timer = setTimeout(()=>ctl.abort(), 20000);
  try{
    const r = await fetch(CONFIG.endpointPago, {
      method:"POST", headers:{"Content-Type":"application/json"}, signal: ctl.signal,
      body: JSON.stringify({
        items: cart.map(i=>({ id:i.id, size:i.size, color:i.color||"", qty:i.qty })),
        cliente: d,
        totalMostrado: ped.total          // el servidor recalcula; esto solo sirve para avisar si cambiaron los precios
      })
    });
    const data = await r.json().catch(()=>({}));
    if(!r.ok || !/^https:\/\//.test(data.init_point||"")){
      const e = new Error("pago"); e.userMsg = data.error || "No pudimos iniciar el pago. Probá de nuevo o pedí por WhatsApp."; throw e;
    }
    // Guardamos el pedido para poder armar el resumen cuando el cliente vuelva
    try{ localStorage.setItem("pedido_mp", JSON.stringify({...ped, ref:data.ref, ts:Date.now()})); }catch(e){}
    window.location.href = data.init_point;   // → Mercado Pago
  }catch(err){
    bloquear(false);
    errorPago(err.userMsg || (err.name==="AbortError"
      ? "Mercado Pago tardó demasiado en responder. Probá de nuevo."
      : "No pudimos conectar con Mercado Pago. Revisá tu conexión y probá de nuevo."));
  }finally{ clearTimeout(timer); }
}

// Si el cliente vuelve con el botón "atrás" desde Mercado Pago, el navegador puede
// restaurar la página con el botón trabado en "Conectando…": lo re-dibujamos.
window.addEventListener("pageshow", e=>{
  if(e.persisted && drawer.classList.contains("open") && step===2) drawerRender();
});

/* ---------- Paso 3: confirmación (WhatsApp o resultado de Mercado Pago) ---------- */
function linkWAResultado(r){
  const ref = r.ref || "";
  const pagoTxt = (r.estado==="ok" ? "✅ Pagado con Mercado Pago"
                 : r.estado==="pendiente" ? "⏳ Pago pendiente de acreditación (Mercado Pago)"
                 : "Pagué con Mercado Pago (todavía sin verificar)") + (r.paymentId ? ` · Pago N° ${r.paymentId}` : "");
  const msg = r.pedido
    ? textoPedido(r.pedido, `¡Hola! Hice este pedido 👟${ref?`\nN° de pedido: ${ref}`:""}`, pagoTxt)
    : `¡Hola! Hice el pedido${ref?" "+ref:""} y pagué con Mercado Pago${r.paymentId?` (Pago N° ${r.paymentId})`:""}. Te paso mis datos de envío para coordinar la entrega:`;
  return "https://wa.me/"+CONFIG.whatsapp+"?text="+encodeURIComponent(msg);
}

function pintarPaso3(body, foot){
  const r = resultadoPago;
  if(!r){   // flujo WhatsApp (efectivo al recibir)
    body.innerHTML = `<div class="empty"><span class="big">✅</span><b>¡Pedido enviado!</b><br>
      <small>Te abrimos WhatsApp con el resumen. Si no se abrió, tocá el botón de abajo.</small></div>`;
    foot.innerHTML = `<button class="wbtn" id="again">💬 Abrir WhatsApp</button>
      <button class="tbtn" data-close>Cerrar</button>`;
    $("#again").onclick = ()=> window.open(lastLink,"_blank");
    return;
  }
  const refTxt = r.ref ? ` Tu número de pedido es <b>${r.ref}</b>.` : "";
  const V = {
    verificando:  ["⏳","Verificando tu pago…","Un segundo, lo estamos confirmando con Mercado Pago."],
    ok:           ["✅","¡Pago aprobado!","Recibimos tu pago."+refTxt+" Mandanos los datos por WhatsApp y coordinamos la entrega."],
    pendiente:    ["⏳","Tu pago está pendiente","Apenas Mercado Pago lo acredite, lo confirmamos."+refTxt+" Mientras tanto, mandanos el pedido por WhatsApp."],
    sinverificar: ["ℹ️","No pudimos verificar el pago","Si pagaste, mandanos el pedido por WhatsApp y lo revisamos a mano."+refTxt],
    fallo:        ["❌","No se pudo completar el pago","Tu pedido sigue guardado: podés intentar de nuevo."]
  }[r.estado];
  body.innerHTML = `<div class="empty"><span class="big">${V[0]}</span><b>${V[1]}</b><br><small>${V[2]}</small></div>`;

  if(r.estado==="verificando"){
    foot.innerHTML = `<button class="tbtn" data-close>Cerrar</button>`;
  }else if(r.estado==="fallo"){
    foot.innerHTML = (cart.length ? `<button class="mpbtn" id="retryPay">Volver a intentar</button>` : "") +
                     `<button class="tbtn" data-close>Cerrar</button>`;
    const b=$("#retryPay"); if(b) b.onclick = ()=>{ resultadoPago=null; step=2; drawerRender(); scrollDrawerTop(); };
  }else{
    foot.innerHTML = `<button class="wbtn" id="sendWA">💬 Enviar mi pedido por WhatsApp</button>
      <button class="tbtn" data-close>Cerrar</button>`;
    $("#sendWA").onclick = ()=> window.open(linkWAResultado(r),"_blank");
  }
}

/* ---------- Eventos del carrito ---------- */
$("#drawerBody").addEventListener("click", e=>{
  const inc=e.target.closest("[data-inc]"), dec=e.target.closest("[data-dec]"), rm=e.target.closest("[data-rm]");
  if(inc){ cart[+inc.dataset.inc].qty++; save(); updateCount(); drawerRender(); }
  if(dec){ const i=+dec.dataset.dec; cart[i].qty--; if(cart[i].qty<1) cart.splice(i,1); save(); updateCount(); drawerRender(); }
  if(rm){ cart.splice(+rm.dataset.rm,1); save(); updateCount(); drawerRender(); }
});

function openDrawer(){
  step = 1; resultadoPago = null;
  lockBody();
  drawer.classList.add("open"); overlay.classList.add("open");
  drawerRender();
  scrollDrawerTop();
}
function closeAll(){
  const wasOpen = drawer.classList.contains("open") || $$(".modal.open").length;
  drawer.classList.remove("open"); overlay.classList.remove("open");
  $$(".modal").forEach(m=>m.classList.remove("open"));
  if(wasOpen) unlockBody();
}
$("#cartBtn").onclick = openDrawer;
overlay.onclick = closeAll;
document.addEventListener("click", e=>{ if(e.target.closest("[data-close]")) closeAll(); });
document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeAll(); });

// En mobile, cuando aparece el teclado, algunos navegadores no
// achican el "layout viewport" aunque sí achican el "visual viewport".
// Ajustamos la altura real del drawer para que el botón de finalizar
// nunca quede tapado por el teclado.
if(window.visualViewport){
  window.visualViewport.addEventListener("resize", ()=>{
    if(drawer.classList.contains("open")){
      drawer.style.height = window.visualViewport.height + "px";
    }
  });
}

/* ---------- Modales de info ---------- */
$("#flinks").addEventListener("click", e=>{
  const b=e.target.closest("[data-info]"); if(!b) return;
  const s=CONFIG.info[+b.dataset.info];
  $("#infoTitle").textContent = s.ico+" "+s.titulo;
  $("#infoBody").innerHTML = s.html;
  lockBody();
  overlay.classList.add("open"); $("#infoModal").classList.add("open");
  $("#infoModal").scrollTop = 0;
});
$("#openSizes").onclick = ()=>{ lockBody(); overlay.classList.add("open"); $("#sizeModal").classList.add("open"); };

/* ---------- Vuelta desde Mercado Pago ----------
   Mercado Pago devuelve al cliente a esta misma página agregando datos en la URL
   (payment_id, status, external_reference…). Esos datos los puede escribir cualquiera,
   así que NO alcanzan para dar el pago por bueno: el estado real se consulta al servidor. */
(function volverDeMercadoPago(){
  if(!CONFIG.pagoMercadoPago) return;
  const q = new URLSearchParams(location.search);
  const refUrl = q.get("external_reference") || "";
  if(!q.has("preference_id") && !refUrl.startsWith("BA-")) return;

  const refValida = v => /^BA-[A-Z0-9]{4,24}$/.test(v||"") ? v : "";
  const idBruto = q.get("payment_id") || q.get("collection_id") || "";
  const paymentId = /^\d{5,20}$/.test(idBruto) ? idBruto : "";
  const statusUrl = q.get("status") || q.get("collection_status") || "";
  const ref = refValida(refUrl);
  history.replaceState(null, "", location.pathname);   // limpiamos la URL

  let guardado = null;
  try{ guardado = JSON.parse(localStorage.getItem("pedido_mp") || "null"); }catch(e){}
  const pedido = (guardado && ref && guardado.ref===ref) ? guardado : null;

  resultadoPago = {
    estado: paymentId ? "verificando" : (["approved","pending","in_process"].includes(statusUrl) ? "sinverificar" : "fallo"),
    paymentId, ref, pedido
  };
  step = 3; lockBody();
  drawer.classList.add("open"); overlay.classList.add("open");
  drawerRender();

  const terminar = ()=>{
    // pago aprobado o en proceso → el pedido ya está hecho, vaciamos el carrito
    if(resultadoPago.estado==="ok" || resultadoPago.estado==="pendiente"){ cart = []; save(); updateCount(); }
    drawerRender();
  };
  if(!paymentId){ terminar(); return; }

  fetch(CONFIG.endpointEstado + "?payment_id=" + paymentId)
    .then(r => r.ok ? r.json() : Promise.reject())
    .then(d => {
      if(ref && d.ref !== ref) throw new Error("otro pedido");
      resultadoPago.ref = refValida(d.ref) || ref;
      resultadoPago.estado = ({ approved:"ok", authorized:"pendiente", pending:"pendiente", in_process:"pendiente", in_mediation:"pendiente" })[d.status] || "fallo";
    })
    .catch(()=>{ resultadoPago.estado = "sinverificar"; })
    .finally(terminar);
})();
</script>
